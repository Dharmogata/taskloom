[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskloom"
version = "0.1.0"
description = "Content-addressed SHA-256 DAG task runner and cache-miss provenance debugger."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Dharmogata", email = "spectacle2002@gmail.com" }
]
keywords = ["task-runner", "dag", "build-system", "cache", "sha256", "provenance", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Dharmogata/taskloom"
Issues = "https://github.com/Dharmogata/taskloom/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "coverage>=7",
    "ruff>=0.9",
]

[project.scripts]
taskloom = "taskloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
